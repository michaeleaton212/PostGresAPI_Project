<div class="page">
  <div class="overview">
    <h3 i18n>Login</h3>

    <form (keydown)="onKeyDown($event)" (ngSubmit)="onLogin()" autocomplete="off">
      <div class="form-group">
        <label for="email" i18n>Email</label>
        <input id="email"
               type="email"
               [(ngModel)]="email"
               (input)="onEmailInput()"
               name="email"
               [class.input-error]="errorEmail"
               required
               autocomplete="username"
               placeholder="your.email@example.com"
               i18n-placeholder />
        <div class="error" [class.hidden]="!errorEmail">
          <span i18n>{{ errorEmail || '&nbsp;' }}</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password" i18n>Password</label>
        <input id="password"
               type="password"
               [(ngModel)]="password"
               (input)="onPasswordInput()"
               name="password"
               [class.input-error]="errorPassword"
               required
               autocomplete="current-password"
               placeholder="••••••••"
               i18n-placeholder />
        <div class="error" [class.hidden]="!errorPassword">
          <span i18n>{{ errorPassword || '&nbsp;' }}</span>
        </div>
      </div>

      <div class="button-row">
        <button class="singin"
                type="submit"
                [disabled]="bookingInProgress"
                i18n>
          { bookingInProgress, select,
          true {Loading...}
          false {Login}
          }
        </button>
      </div>

      <div class="error" *ngIf="error">
        <span i18n>{{ error }}</span>
      </div>

      <div class="register-link">
        <span i18n>Noch kein Konto?</span>
        <a routerLink="/register" i18n>Jetzt registrieren</a>
      </div>
    </form>
  </div>
</div>

<app-footer></app-footer>
